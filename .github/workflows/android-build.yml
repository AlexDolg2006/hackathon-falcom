name: "Android APK Export"

on:
  push:
    branches: [develop, main]
  workflow_dispatch:   # ручной запуск кнопкой "Run workflow"

env:
  GODOT_VERSION: "4.7.2"          # версия Godot (проект на 4.7)
  PRESET_NAME: "Android"          # имя пресета из export_presets.cfg
  ANDROID_BUILD_TOOLS: "35.0.1"
  ANDROID_PLATFORM: "android-35"
  ANDROID_NDK: "28.1.13356709"
  ANDROID_CMAKE: "3.10.2.4988404"

jobs:
  export-android:
    name: Android Export
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Официальный action: сам скачивает cmdline-tools, ставит ANDROID_HOME и принимает лицензии
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          sdkmanager \
            "platform-tools" \
            "build-tools;${ANDROID_BUILD_TOOLS}" \
            "platforms;${ANDROID_PLATFORM}" \
            "cmake;${ANDROID_CMAKE}" \
            "ndk;${ANDROID_NDK}"

      - name: Download Godot and export templates
        run: |
          BASE="https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-stable"

          # Редактор
          wget -q "${BASE}/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q "Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          mv "Godot_v${GODOT_VERSION}-stable_linux.x86_64" godot
          chmod +x godot

          # Шаблоны экспорта
          wget -q "${BASE}/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          unzip -q "Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          mkdir -p ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          mv templates/* ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable/

      - name: Create debug keystore
        run: |
          keytool -genkeypair -v \
            -keystore "$HOME/debug.keystore" \
            -alias androiddebugkey \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass android -keypass android \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Configure Godot editor settings
        run: |
          mkdir -p ~/.config/godot
          cat > ~/.config/godot/editor_settings-4.tres << SETTINGS
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/java_sdk_path = "${JAVA_HOME}"
          export/android/android_sdk_path = "${ANDROID_HOME}"
          export/android/debug_keystore = "${HOME}/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          SETTINGS
          cp ~/.config/godot/editor_settings-4.tres ~/.config/godot/editor_settings-4.7.tres

      - name: Import project resources
        run: |
          # первый импорт создаёт .godot/ (он в .gitignore); может вернуть ненулевой код — это нормально
          ./godot --headless --import || true

      - name: Export APK
        run: |
          mkdir -p build/android
          ./godot --headless --export-debug "${PRESET_NAME}" build/android/game.apk
          ls -lh build/android/

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: game-apk
          path: build/android/game.apk
          if-no-files-found: error
