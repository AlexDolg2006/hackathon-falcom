name: "Android APK Export"
on:
  push:
    branches:
      - develop

jobs:
  export-android:
    name: Android Export
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Android SDK (Manual Setup)
        run: |
          # 1. Создаем структуру папок для SDK
          mkdir -p $HOME/Android/Sdk/cmdline-tools
          
          # 2. Скачиваем официальные базовые инструменты командной строки Android через curl
          curl -L "https://google.com" -o cmdline.zip
          
          # 3. Распаковываем архив
          unzip cmdline.zip -d $HOME/Android/Sdk/cmdline-tools/
          mv $HOME/Android/Sdk/cmdline-tools/cmdline-tools $HOME/Android/Sdk/cmdline-tools/latest
          
          # 4. Скачиваем нужные платформы через sdkmanager и автоматически принимаем лицензии
          yes | $HOME/Android/Sdk/cmdline-tools/latest/bin/sdkmanager --sdk_root=$HOME/Android/Sdk "platform-tools" "build-tools;34.0.0" "platforms;android-34"

      - name: Download Godot Engine & Templates
        run: |
          # Скачиваем официальный стабильный Godot 4.7.2 для Linux
          wget https://github.com
          unzip Godot_v4.7.2-stable_linux.x86_64.zip
          mv Godot_v4.7.2-stable_linux.x86_64 godot
          chmod +x godot
          
          # Скачиваем официальные шаблоны экспорта
          wget https://github.com
          unzip Godot_v4.7.2-stable_export_templates.tpz
          
          # Раскладываем шаблоны по правильному пути для Godot 4
          mkdir -p ~/.local/share/godot/export_templates/4.7.2.stable
          mv templates/* ~/.local/share/godot/export_templates/4.7.2.stable/

      - name: Create Debug Keystore
        run: |
          keytool -keyalg RSA -genkeypair -alias androiddebugkey -keypass android -keystore ./debug.keystore -storepass android -dname "CN=Android Debug,O=Android,C=US" -validity 365

      - name: Godot Android Export
        run: |
          mkdir -p build/android
          # Подменяем путь к SDK и тестовому Keystore внутри файла конфигурации на сервере
          sed -i 's|custom_template/release=.*|custom_template/release=""|g' export_presets.cfg || true
          sed -i 's|keystore/debug=.*|keystore/debug="./debug.keystore"|g' export_presets.cfg || true
          ./godot --headless --export-release "Android" build/android/game.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: game-apk
          path: build/android/game.apk
